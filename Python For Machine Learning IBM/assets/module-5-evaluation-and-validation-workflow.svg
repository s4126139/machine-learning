<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">Machine learning evaluation and validation workflow</title>
  <desc id="desc">A safe workflow for choosing a split, fitting preprocessing inside cross-validation folds, selecting metrics, refitting on training data and using a held-out test set once. Below are quick metric reminders for classification, regression and clustering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9ff"/>
      <stop offset="1" stop-color="#f0f7f5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#20314a" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8695aa"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #1d2b43; }
      .title { font-size: 35px; font-weight: 700; letter-spacing: -.4px; }
      .subtitle { font-size: 17px; fill: #62718a; }
      .cardtitle { font-size: 19px; font-weight: 700; }
      .body { font-size: 15px; fill: #43536b; }
      .small { font-size: 13px; fill: #62718a; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: .8px; }
      .step { font-size: 14px; font-weight: 700; }
      .metric { font-size: 15px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1440" height="1000" rx="28" fill="url(#bg)"/>
  <circle cx="1346" cy="74" r="116" fill="#dcece7" opacity=".58"/>
  <circle cx="84" cy="919" r="139" fill="#e5eafd" opacity=".64"/>
  <text x="72" y="77" class="title">Evaluate for the decision you need to make</text>
  <text x="74" y="110" class="subtitle">Choose a split that matches the data, keep each fold honest, and protect the final test.</text>
  <text x="72" y="159" class="label" fill="#65738a">VALIDATION WORKFLOW</text>

  <g filter="url(#shadow)">
    <rect x="64" y="181" width="246" height="189" rx="18" fill="#ffffff"/>
    <circle cx="99" cy="218" r="17" fill="#e8edff"/>
    <text x="94" y="224" class="step" fill="#4967c1">1</text>
    <text x="126" y="224" class="cardtitle">Split by design</text>
    <text x="88" y="263" class="body">Independent rows:</text>
    <text x="88" y="285" class="small">stratify classification</text>
    <text x="88" y="312" class="body">Related or ordered data:</text>
    <text x="88" y="334" class="small">groups / time-based split</text>

    <rect x="353" y="181" width="246" height="189" rx="18" fill="#ffffff"/>
    <circle cx="388" cy="218" r="17" fill="#e6f7f2"/>
    <text x="383" y="224" class="step" fill="#14826f">2</text>
    <text x="415" y="224" class="cardtitle">Tune within folds</text>
    <text x="377" y="263" class="body">Each fold fits its own</text>
    <text x="377" y="285" class="body">imputer, scaler, PCA,</text>
    <text x="377" y="307" class="body">selection and estimator.</text>
    <text x="377" y="341" class="small">Use Pipeline + CV search.</text>

    <rect x="642" y="181" width="246" height="189" rx="18" fill="#ffffff"/>
    <circle cx="677" cy="218" r="17" fill="#fff1dc"/>
    <text x="672" y="224" class="step" fill="#b96b13">3</text>
    <text x="704" y="224" class="cardtitle">Select by metric</text>
    <text x="666" y="263" class="body">Match scoring to the</text>
    <text x="666" y="285" class="body">cost of false alarms,</text>
    <text x="666" y="307" class="body">misses or large errors.</text>
    <text x="666" y="341" class="small">Review folds, not only mean.</text>

    <rect x="931" y="181" width="205" height="189" rx="18" fill="#ffffff"/>
    <circle cx="966" cy="218" r="17" fill="#f0eafe"/>
    <text x="961" y="224" class="step" fill="#8050b2">4</text>
    <text x="993" y="224" class="cardtitle">Refit</text>
    <text x="955" y="263" class="body">Refit the selected</text>
    <text x="955" y="285" class="body">pipeline on all training</text>
    <text x="955" y="307" class="body">data available.</text>
    <text x="955" y="341" class="small">Keep test rows separate.</text>

    <rect x="1179" y="181" width="197" height="189" rx="18" fill="#ffffff"/>
    <circle cx="1214" cy="218" r="17" fill="#ffe9e8"/>
    <text x="1209" y="224" class="step" fill="#bf5752">5</text>
    <text x="1241" y="224" class="cardtitle">Test once</text>
    <text x="1203" y="263" class="body">Final held-out check</text>
    <text x="1203" y="285" class="body">after choices are done.</text>
    <text x="1203" y="319" class="small">No retuning to this score.</text>
  </g>
  <path d="M315 275h27" stroke="#8695aa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M604 275h27" stroke="#8695aa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M893 275h27" stroke="#8695aa" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1141 275h27" stroke="#8695aa" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="64" y="398" width="1312" height="76" rx="16" fill="#fff5e7" stroke="#f0d7b0"/>
  <path d="M98 421l17 30H81z" fill="#e7a33c"/>
  <text x="94" y="444" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">!</text>
  <text x="132" y="428" class="label" fill="#a26012">LEAKAGE TRIPWIRE</text>
  <text x="132" y="453" class="body">Never fit preprocessing on all rows before cross-validation. Never use future information or repeatedly tune to the final test score.</text>

  <text x="72" y="527" class="label" fill="#65738a">METRIC QUICK GUIDE</text>
  <g filter="url(#shadow)">
    <rect x="64" y="548" width="410" height="309" rx="18" fill="#ffffff"/>
    <rect x="64" y="548" width="410" height="8" rx="4" fill="#5274d8"/>
    <text x="90" y="591" class="cardtitle">Classification</text>
    <text x="90" y="622" class="body">Start with the confusion matrix:</text>
    <rect x="90" y="641" width="358" height="1" fill="#e4e9f1"/>
    <text x="90" y="674" class="metric">Precision = TP / (TP + FP)</text>
    <text x="90" y="696" class="small">Fewer false alarms among positive predictions.</text>
    <text x="90" y="731" class="metric">Recall = TP / (TP + FN)</text>
    <text x="90" y="753" class="small">Fewer missed positives among actual positives.</text>
    <text x="90" y="788" class="metric">F1 balances precision and recall.</text>
    <text x="90" y="820" class="small">Check per-class scores when classes are imbalanced.</text>

    <rect x="515" y="548" width="410" height="309" rx="18" fill="#ffffff"/>
    <rect x="515" y="548" width="410" height="8" rx="4" fill="#1a9a88"/>
    <text x="541" y="591" class="cardtitle">Regression</text>
    <text x="541" y="622" class="body">Choose how to count residuals:</text>
    <rect x="541" y="641" width="358" height="1" fill="#e4e9f1"/>
    <text x="541" y="674" class="metric">MAE = mean absolute error</text>
    <text x="541" y="696" class="small">Typical miss in the target’s units.</text>
    <text x="541" y="731" class="metric">RMSE = sqrt(mean squared error)</text>
    <text x="541" y="753" class="small">Large misses weigh more heavily.</text>
    <text x="541" y="788" class="metric">R² compares against a mean baseline.</text>
    <text x="541" y="820" class="small">Can be negative on held-out data; plot residuals.</text>

    <rect x="966" y="548" width="410" height="309" rx="18" fill="#ffffff"/>
    <rect x="966" y="548" width="410" height="8" rx="4" fill="#9b63c8"/>
    <text x="992" y="591" class="cardtitle">Clustering &amp; reduction</text>
    <text x="992" y="622" class="body">No single metric establishes useful structure.</text>
    <rect x="992" y="641" width="358" height="1" fill="#e4e9f1"/>
    <text x="992" y="674" class="metric">Silhouette: higher is better separated.</text>
    <text x="992" y="696" class="small">Assumes distances suit the cluster geometry.</text>
    <text x="992" y="731" class="metric">Davies–Bouldin: lower is better.</text>
    <text x="992" y="753" class="small">Inertia always drops as K increases.</text>
    <text x="992" y="788" class="metric">Check stability and domain usefulness.</text>
    <text x="992" y="820" class="small">PCA: explained variance; embeddings: neighbors.</text>
  </g>

  <rect x="64" y="888" width="1312" height="62" rx="15" fill="#eaf0fb"/>
  <text x="91" y="915" class="step" fill="#344e89">Always report:</text>
  <text x="208" y="915" class="body">split strategy • metric and positive class • fold variation • final test score • known limits</text>
  <text x="91" y="936" class="small">For grouped or time-dependent data, preserve those boundaries in every validation split.</text>
</svg>