<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
  <title id="title">A practical starting point for choosing a supervised model</title>
  <desc id="description">First identify whether the target is a category or a number. Classification options include decision trees, K-nearest neighbors, support vector machines, and ensembles. Regression options include regression trees, K-nearest neighbors, support vector regression, and ensembles. Validate candidates using the metric that matches the task.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef4f7"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#143044" flood-opacity=".08"/></filter>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#163246}
      .eyebrow{font-size:14px;font-weight:800;letter-spacing:2px}
      .h1{font-size:32px;font-weight:750;letter-spacing:-.5px}
      .sub{font-size:16px;fill:#5a7180}
      .branch{font-size:20px;font-weight:800}
      .card-title{font-size:17px;font-weight:750}
      .body{font-size:14px;fill:#526b7b}
      .small{font-size:13px;fill:#607887}
      .step{font-size:14px;font-weight:750}
      .card{fill:#fff;stroke:#d8e3e9;stroke-width:1.2;filter:url(#shadow)}
      .line{fill:none;stroke:#9db3bf;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1200" height="820" rx="28" fill="url(#bg)"/>
  <text x="64" y="60" class="eyebrow" fill="#117e83">SUPERVISED LEARNING · MODULE 3</text>
  <text x="64" y="105" class="h1">Start with the target, then compare candidates</text>
  <text x="64" y="136" class="sub">A model family is a starting hypothesis. Validation decides whether it suits your data.</text>

  <rect x="415" y="164" width="370" height="76" rx="18" fill="#163246" filter="url(#shadow)"/>
  <text x="600" y="194" text-anchor="middle" fill="#a8d9d5" font-size="13" font-weight="800" letter-spacing="1.5">FIRST ASK</text>
  <text x="600" y="220" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="750">What kind of target do you have?</text>
  <path d="M600 240v28H330v18M600 268h270v18" class="line"/>
  <path d="M330 286l-7-11m7 11 7-11M870 286l-7-11m7 11 7-11" class="line"/>

  <rect x="56" y="302" width="548" height="366" rx="22" fill="#e7f5f3" stroke="#b5ded9"/>
  <rect x="596" y="302" width="548" height="366" rx="22" fill="#fff4e3" stroke="#f1d5a7"/>
  <circle cx="94" cy="342" r="18" fill="#12817f"/><text x="94" y="348" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">A</text>
  <text x="126" y="350" class="branch" fill="#116e70">Categorical target → classification</text>
  <circle cx="634" cy="342" r="18" fill="#ca7a1b"/><text x="634" y="348" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">B</text>
  <text x="666" y="350" class="branch" fill="#9c5e13">Numeric target → regression</text>

  <rect x="80" y="378" width="240" height="100" rx="15" class="card"/>
  <text x="100" y="409" class="card-title">Decision tree</text>
  <text x="100" y="434" class="body">Readable if-then rules;</text><text x="100" y="455" class="body">handles thresholds and interactions.</text>
  <rect x="338" y="378" width="240" height="100" rx="15" class="card"/>
  <text x="358" y="409" class="card-title">K-nearest neighbors</text>
  <text x="358" y="434" class="body">Useful when nearby examples</text><text x="358" y="455" class="body">should have similar labels.</text>
  <rect x="80" y="494" width="240" height="100" rx="15" class="card"/>
  <text x="100" y="525" class="card-title">Support vector machine</text>
  <text x="100" y="550" class="body">Margin-based; scale features.</text><text x="100" y="571" class="body">Tune kernel and regularization.</text>
  <rect x="338" y="494" width="240" height="100" rx="15" class="card"/>
  <text x="358" y="525" class="card-title">Random forest / boosting</text>
  <text x="358" y="550" class="body">Strong nonlinear candidates;</text><text x="358" y="571" class="body">compare with validation.</text>

  <rect x="620" y="378" width="240" height="100" rx="15" class="card"/>
  <text x="640" y="409" class="card-title">Regression tree</text>
  <text x="640" y="434" class="body">Readable piecewise values;</text><text x="640" y="455" class="body">limited extrapolation.</text>
  <rect x="878" y="378" width="240" height="100" rx="15" class="card"/>
  <text x="898" y="409" class="card-title">K-nearest neighbors</text>
  <text x="898" y="434" class="body">Local average or median;</text><text x="898" y="455" class="body">scale features and tune k.</text>
  <rect x="620" y="494" width="240" height="100" rx="15" class="card"/>
  <text x="640" y="525" class="card-title">Support vector regression</text>
  <text x="640" y="550" class="body">Margin/tolerance tube; scale</text><text x="640" y="571" class="body">features and tune epsilon.</text>
  <rect x="878" y="494" width="240" height="100" rx="15" class="card"/>
  <text x="898" y="525" class="card-title">Random forest / boosting</text>
  <text x="898" y="550" class="body">Flexible tabular candidates;</text><text x="898" y="571" class="body">watch complexity and noise.</text>

  <rect x="174" y="704" width="852" height="70" rx="18" fill="#fff" stroke="#d8e3e9" filter="url(#shadow)"/>
  <circle cx="210" cy="739" r="17" fill="#163246"/><text x="210" y="744" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">✓</text>
  <text x="242" y="733" class="step">Then compare on held-out or cross-validated data</text>
  <text x="242" y="755" class="small">Use a task-matched metric, keep preprocessing inside each training fold, and check the bias–variance gap.</text>
</svg>
